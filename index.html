<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000"><title>NC Checker</title>
<style>html,body{margin:0;background:#000;color:#fff;font:14px system-ui,sans-serif;height:100%}body{display:flex;align-items:center;justify-content:center}</style></head>
<body><iframe id="f" style="position:fixed;inset:0;width:100%;height:100%;border:0;background:#000"></iframe><div id="dbg" style="position:fixed;left:6px;right:6px;bottom:4px;z-index:9;color:#777;font:10px monospace;pointer-events:none;white-space:pre-wrap"></div>
<script>(function(){
var UPDATE_URL="https://raw.githubusercontent.com/slizgiziom3000-sudo/mc-updates/main/publish/";
var PUB="BFM5mBOJihhFq0Ag6SrJp1NjMYYEpk_JxdHiFRLtK_jAZtIWMNSHA0U-sJi4xD9-s6vyb908H-v0QCbO9gLYpRE";
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
var LOG=[];function log(t){LOG.push(new Date().toLocaleTimeString()+" "+t);if(LOG.length>12)LOG.shift();lsSet("ncDbg",LOG.join("\n"))}
var prev=lsGet("ncDbg");if(prev){var d=document.getElementById("dbg");d.textContent="prev run:\n"+prev.split("\n").slice(-6).join("\n");setTimeout(function(){d.textContent=""},9000)}
log("start");
window.addEventListener("error",function(e){log("ERR "+e.message)});
window.addEventListener("unhandledrejection",function(e){log("REJ "+(e.reason&&e.reason.message||e.reason))});
window.addEventListener("pagehide",function(){log("pagehide (reload/exit)")});
var H=window.Capacitor&&window.Capacitor.Plugins&&window.Capacitor.Plugins.CapacitorHttp;
window.mcBridge={fetchText:async function(url){
  try{var u=new URL(url);
    if(u.protocol!=="https:"||u.hostname!=="auth.roblox.com"||u.pathname!=="/v1/usernames/validate")return{error:"blocked url"};
    var r=await H.get({url:u.href,responseType:"text",connectTimeout:9000,readTimeout:9000,headers:{"Accept":"application/json"}});
    var b=typeof r.data==="string"?r.data:JSON.stringify(r.data);
    return{status:r.status,body:b.slice(0,200000)};
  }catch(e){return{error:String(e&&e.message||e).slice(0,120)}}}};
async function txt(u,ms){var c=new AbortController(),t=setTimeout(function(){c.abort()},ms);
  try{var r=await fetch(u,{signal:c.signal,cache:"no-store"});if(!r.ok)throw Error(r.status);return await r.text()}finally{clearTimeout(t)}}
function show(h){
  var f=document.getElementById("f");
  var inj="<script>try{window.mcBridge=parent.mcBridge;window.addEventListener('pagehide',function(){try{parent.__ncLog('iframe pagehide')}catch(e){}});window.addEventListener('error',function(e){try{parent.__ncLog('iframe ERR '+e.message)}catch(x){}})}catch(e){}<\/script>";
  window.__ncLog=log;
  f.onload=function(){log("iframe loaded")};
  f.srcdoc=h.replace(/<head[^>]*>/i,function(m){return m+inj});
  log("page shown");
}
(async function(){
  var bundledV=parseInt(await txt("version.txt",3000),10)||0;
  var cachedV=parseInt(lsGet("ncAppVer"),10)||0, cached=lsGet("ncAppPage");
  var html=null;
  if(cached&&cachedV>bundledV)html=cached;
  if(!html)html=await txt("page.html",8000);
  show(html);
  try{
    var v=parseInt((await txt(UPDATE_URL+"version.txt",6000)).trim(),10);
    if(v>Math.max(bundledV,cachedV)){
      var h=await txt(UPDATE_URL+"page.html",20000);
      if(h.length>5000&&h.indexOf(PUB)>-1){lsSet("ncAppPage",h);lsSet("ncAppVer",String(v));log("update cached v"+v)}
    }
  }catch(e){}
})().catch(function(e){log("FATAL "+e);document.getElementById("dbg").textContent="Error: "+e});
})();</script></body></html>
